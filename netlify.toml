[build]
  command = "npm --prefix frontend run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
